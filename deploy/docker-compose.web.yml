networks:
    observer-net:
        driver: bridge

services:
    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile
        ports:
            -   "127.0.0.1:8080:8080"
        networks:
            -   observer-net
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2)"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    frontend:
        build:
            context: ../frontend
            dockerfile: Dockerfile
        ports:
            -   "127.0.0.1:8081:80"
        networks:
            -   observer-net
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 5s
