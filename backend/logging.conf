[loggers]
keys=root,appLogger

[handlers]
keys=consoleHandler,otelHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_appLogger]
level=INFO
handlers=consoleHandler,otelHandler
qualname=appLogger
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_otelHandler]
class=opentelemetry.sdk._logs.LoggingHandler
level=INFO
formatter=simpleFormatter
args=()

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
